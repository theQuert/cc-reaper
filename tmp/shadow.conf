# Deployed session-reaper policy for this Mac mini (stima-api#3954). Not in git.
# APPLY stays 0 until Leo confirms in a session.
APPLY=0
IDLE_MINUTES=60
# 2026-10-16 Leo approved (Neo EL-14000, IDLE-REAP-APPROVED): never reap only ops-dispatch and the sessions Leo named
# (anyfast*: AnyFast/OpenLux first priority); workflow-audit and homepage are never touched by order. Everything else is
# kept by the gates (idle, shells, scheduled task, waiting, open issue, dirty or unpushed worktree), not by name.
# 2026-10-16 20:5x TPE Neo EL-15000: dashboard-perf took #4908, keep it (removed from the EL-14000 close list).
PROTECT=ops-dispatch anyfast* workflow-audit homepage dashboard-perf enterprise-form-redesign
REPOS=
CLOSED_LOG=/Users/stimaclaw/GitHub/cc-reaper-worktrees/fix-reaper-batch-issue-state/tmp/closed.md
REPORT=/Users/stimaclaw/GitHub/cc-reaper-worktrees/fix-reaper-batch-issue-state/tmp/report-base.md
WAITING_EXTRA=等 ?Leo|Leo 決定|Leo 確認|Leo 本人
TRACKING_ISSUE=theQuert/stima-api#3954

# 2026-10-13 cc-reaper#89 (EL-TMUX-RECLAIM step 1): keep gates only, never reaps more
SUBAGENT_QUIET_MINUTES=30
PROMPT_RE=\(y/n\)|do you want to proceed|waiting for input|NEEDS_HUMAN|@neo\b|@leo\b
RELAY_DIR=~/handoffs/relay-requests
RELAY_MAX_AGE_HOURS=48
HANDOFF_ROOT=~/handoffs
REAPED_DIR=~/handoffs/reaped

# 2026-10-16 Leo approved (Neo EL-14000 item a): daily report-only list, sessions idle >= 6 h with no claimed issue.
IDLE_LIST_HOURS=6
IDLE_LIST_FILE=/Users/stimaclaw/GitHub/cc-reaper-worktrees/fix-reaper-batch-issue-state/tmp/idle.md
IDLE_LIST_INBOX=
IDLE_LIST_EXCLUDE=ops-dispatch workflow-audit homepage enterprise-form-redesign

# EL-FLOW-P2-2106 (2026-10-25): inbox-DONE close path stays off until report-only spot-checks are clean (SCRIPT-SAFE-RULE)
DONE_INBOX=
# stima-api #6535 gap 2 (cc-reaper#111): report-only; marks kept sessions DONE_INBOX would close. DONE_INBOX stays off until 5 clean rounds.
DONE_INBOX_SHADOW=~/handoffs/neo-inbox.md

# stall-watch (cc-reaper #115), shadow: reports nothing, writes no mark
STALL_APPLY=0
STALL_INBOX=~/handoffs/neo-inbox.md
STALL_STATE=~/.cc-reaper/state/stall-watch.json
# One <session id>.json per stalled session, written only when STALL_APPLY=1; session-reaper.py keeps it with the
# reason stalled:<fingerprint> (empty: off). A mark not refreshed for STALL_MARK_HOURS is ignored, and so is one
# whose event was first seen more than STALL_MARK_MAX_HOURS ago, however fresh it is. Never point this at a
# directory that holds other files (for example ~/.claude/sessions): it is refused.
STALL_MARK_DIR=~/.cc-reaper/state/stalled
STALL_MARK_HOURS=12
STALL_MARK_MAX_HOURS=48
# Panes showing "Request interrupted" at an idle prompt at once that count as an account switch (a lone Esc does not).
STALL_FLEET_MIN=2
