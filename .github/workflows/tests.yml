name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  suites:
    # The scripts target macOS (BSD stat, launchd), so the suites run there. The repository is public:
    # GitHub-hosted minutes are free. Add a suite here when a PR changes the script it covers.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: git identity for fixture repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: syntax
        run: |
          for f in shell/*.sh hooks/*.sh; do bash -n "$f"; done
          zsh -n shell/claude-cleanup.sh
      - name: stall-watch
        run: python3 tests/stall-watch.py
      - name: session-reaper
        run: python3 tests/session-reaper.py
      - name: disk-janitor
        run: bash tests/disk-janitor.sh
      - name: worktree-janitor
        # The no-pull-request probe calibrates against this repository's real pull requests via gh.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/worktree-janitor.sh
      - name: worktree-janitor-reclaim
        run: bash tests/worktree-janitor-reclaim.sh
      - name: reclaim-byproducts
        run: bash tests/reclaim-byproducts.sh
      - name: reclaim-byproducts-watchdog
        run: bash tests/reclaim-byproducts-watchdog.sh
      - name: worktree-janitor-newrules
        run: bash tests/worktree-janitor-newrules.sh
      - name: worktree-janitor-pushed-idle
        run: bash tests/worktree-janitor-pushed-idle.sh
      - name: worktree-janitor-order
        run: bash tests/worktree-janitor-order.sh
      - name: worktree-janitor-unknown-session
        run: bash tests/worktree-janitor-unknown-session.sh
      - name: worktree-active-sessions
        run: bash tests/worktree-active-sessions.sh
      - name: resource-watch
        run: bash tests/resource-watch.sh
      - name: resource-watch-watchdog
        run: bash tests/resource-watch-watchdog.sh
