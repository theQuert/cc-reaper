# Optional overrides for ~/.cc-reaper/disk-janitor.sh, sourced before its defaults.
# Write each as `: "${NAME:=value}"` so an explicit environment value still wins.
#
# : "${CC_DJ_DISK_MIN_PCT:=15}"
# : "${CC_DJ_TRIM_WORKTREES:=1}"
# : "${CC_DJ_ACT_FREE_GB:=30}"         # act below this many GB free; off disables
# : "${CC_DJ_ACT_COOLDOWN_SECS:=10800}"
# : "${CC_DJ_ACT_TRIM_SECONDS:=900}"   # soft: the janitor finishes its current step
# : "${CC_DJ_ALERT_ISSUE:=owner/repo#N}"  # comment the action here
# : "${CC_DJ_DEV_SERVER_REAP:=report}"   # off | report | apply: dev servers serving nothing
# : "${CC_DJ_DEV_SERVER_MIN_HOURS:=6}"
# : "${CC_DJ_TMP_AGE_DAYS:=3}"
