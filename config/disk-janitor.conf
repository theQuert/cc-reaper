# Optional local adapter settings for builder-cache lifecycle cleanup.
# Keep the generic default protected-container label unless the local runtime
# cannot attach labels; then add a runtime-specific filter on a separate line.
#
# CC_DJ_DRAIN_PROOF_MAX_AGE_SECONDS=900
# CC_DJ_PROTECTED_CONTAINER_FILTERS='label=cc.reaper.protect=true'
#
# A project adapter should set CC_DJ_DRAIN_PROOF_FILE only for a single
# --orbstack-clean invocation after it has drained its own runners.
