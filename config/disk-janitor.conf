# Optional overrides for ~/.cc-reaper/disk-janitor.sh, sourced before its defaults.
# Write each as `: "${NAME:=value}"` so an explicit environment value still wins.
#
# : "${CC_DJ_DISK_MIN_PCT:=15}"
# : "${CC_DJ_TRIM_WORKTREES:=1}"
# : "${CC_DJ_ACT_FREE_GB:=30}"         # act below this many GB free; off disables
# : "${CC_DJ_ACT_COOLDOWN_SECS:=10800}"
# : "${CC_DJ_ACT_LOW_FREE_GB:=20}"        # under this many GB free (the CI heavy-slot floor) ...
# : "${CC_DJ_ACT_LOW_COOLDOWN_SECS:=3300}" # ... the act may repeat this often (an hour less one check's lead time)
# : "${CC_DJ_ACT_GO_CACHE_HOOK:=$HOME/.cc-reaper/reclaim-byproducts.sh}"  # missing = an ERROR line + alert, not a skip
# : "${CC_DJ_ACT_TEMPLATES_PRUNE_DAYS:=7}"  # act drops node_modules templates unused this many days; off disables
# : "${CC_DJ_ACT_TEMPLATE_SCRIPT:=$HOME/.claude/hooks/node-modules-template.sh}"  # the step needs its owner present
# : "${CC_DJ_GO_BUILD_MAX_AGE_MIN:=120}"  # under CC_DJ_ACT_LOW_FREE_GB the act drops go build cache entries unused this many
#                                         # minutes (rule go-build-age; min 60, Go refreshes a used entry's mtime hourly); off disables
# : "${CC_DJ_GO_BUILD_DIR:=$HOME/Library/Caches/go-build}"  # default: `go env GOCACHE`
# Deletion steps added to the act start in spot-check mode: they log what they would remove (path,
# size, a per-path lsof result; for go-build-age a count, bytes and a sample) to
# ~/.cc-reaper/logs/spotcheck-disk-janitor.log under a run id and delete nothing. `auto` deletes
# templates only when a fresh lsof shows them unheld, go build cache entries by age alone (Go
# rebuilds a deleted entry), and never anything under the trees of the homepage, uiux or
# verify-signin-redesign sessions. Switch after reading the log.
# : "${CC_DJ_NEW_STEPS_MODE:=spotcheck}"   # spotcheck | auto
# : "${CC_DJ_ACT_TRIM_SECONDS:=900}"   # soft: the janitor finishes its current step
# : "${CC_DJ_ALERT_ISSUE:=owner/repo#N}"  # comment the action here
# : "${CC_DJ_DEV_SERVER_REAP:=report}"   # off | report | apply: dev servers serving nothing
# : "${CC_DJ_DEV_SERVER_MIN_HOURS:=6}"
# : "${CC_DJ_TMP_AGE_DAYS:=3}"
# : "${CC_DJ_NPM_CACHE:=on}"          # off: weekly clean leaves the npm content cache alone
# : "${CC_DJ_NPX_TRIM_DAYS:=14}"      # remove ~/.npm/_npx installs unused this many days; off disables
# : "${CC_DJ_GO_MODCACHE:=on}"        # off: no `go clean -modcache` even under disk pressure
# The host's memory-pressure samples ("<UTC>Z ... mp=<level> ..."), which widen the dev-server
# reaper's pressure window to the last hour. Exported: the reaper runs as a child. Unset, it
# reads only the live level.
# : "${CC_DEV_SERVER_PRESSURE_LOG:=$HOME/<sampler>/pressure.log}"; export CC_DEV_SERVER_PRESSURE_LOG
