# Optional overrides for ~/.cc-reaper/disk-janitor.sh, sourced before its defaults.
# Write each as `: "${NAME:=value}"` so an explicit environment value still wins.
#
# : "${CC_DJ_DISK_MIN_PCT:=15}"
# : "${CC_DJ_TRIM_WORKTREES:=1}"
# : "${CC_DJ_ACT_FREE_GB:=30}"         # act below this many GB free; off disables
# : "${CC_DJ_ACT_COOLDOWN_SECS:=10800}"
# : "${CC_DJ_ACT_LOW_FREE_GB:=20}"        # under this many GB free (the CI heavy-slot floor) ...
# : "${CC_DJ_ACT_LOW_COOLDOWN_SECS:=3300}" # ... the act may repeat this often (an hour less one check's lead time)
# : "${CC_DJ_ACT_GO_CACHE_HOOK:=$HOME/.cc-reaper/reclaim-byproducts.sh}"  # missing = an ERROR line + alert, not a skip
# : "${CC_DJ_ACT_TEMPLATES_PRUNE_DAYS:=7}"  # act drops node_modules templates unused this many days; off disables
# : "${CC_DJ_ACT_TEMPLATE_SCRIPT:=$HOME/.claude/hooks/node-modules-template.sh}"  # the step needs its owner present
# : "${CC_DJ_GO_BUILD_MAX_AGE_MIN:=120}"  # under CC_DJ_ACT_LOW_FREE_GB the act drops go build cache entries unused this many
#                                         # minutes (rule go-build-age; min 60, Go refreshes a used entry's mtime hourly); off disables
# : "${CC_DJ_GO_BUILD_DIR:=$HOME/Library/Caches/go-build}"  # default: `go env GOCACHE`
# : "${CC_DJ_GO_BUILD_CAP_GB:=8}"      # the same step also runs, whatever the free space, when the cache is over this many GB
#                                       # (decimals allowed; one bounded `du -sk`); off disables. From --check, independent of the act
# : "${CC_DJ_GO_BUILD_FREE_GB:=35}"    # ... and when free space is under this many GB (a soft floor above CC_DJ_ACT_LOW_FREE_GB); off disables
#                                       # Both obey CC_DJ_NEW_STEPS_MODE: spotcheck (default) logs decision=would-remove, deletes nothing.
#                                       # auto skips any entry a process holds open (one lsof right before the delete); no usable lsof deletes nothing.
# Deletion steps added to the act start in spot-check mode: they log what they would remove (path,
# size, a per-path lsof result; for go-build-age a count, bytes and a sample) to
# ~/.cc-reaper/logs/spotcheck-disk-janitor.log under a run id and delete nothing. `auto` deletes
# templates only when a fresh lsof shows them unheld, go build cache entries by age alone (Go
# rebuilds a deleted entry), and never anything under the trees of the homepage, uiux or
# verify-signin-redesign sessions. Switch after reading the log.
# : "${CC_DJ_NEW_STEPS_MODE:=spotcheck}"   # spotcheck | auto
# : "${CC_DJ_ACT_TRIM_SECONDS:=900}"   # soft: the janitor finishes its current step
# : "${CC_DJ_ALERT_ISSUE:=owner/repo#N}"  # comment the action here
# : "${CC_DJ_DEV_SERVER_REAP:=report}"   # off | report | apply: dev servers serving nothing
# : "${CC_DJ_DEV_SERVER_MIN_HOURS:=6}"
# : "${CC_DJ_TMP_AGE_DAYS:=3}"
# : "${CC_DJ_NPM_CACHE:=on}"          # off: weekly clean leaves the npm content cache alone
# : "${CC_DJ_NPX_TRIM_DAYS:=14}"      # remove ~/.npm/_npx installs unused this many days; off disables
# : "${CC_DJ_GO_MODCACHE:=on}"        # off: no `go clean -modcache` even under disk pressure
# The host's memory-pressure samples ("<UTC>Z ... mp=<level> ..."), which widen the dev-server
# reaper's pressure window to the last hour. Exported: the reaper runs as a child. Unset, it
# reads only the live level.
# : "${CC_DEV_SERVER_PRESSURE_LOG:=$HOME/<sampler>/pressure.log}"; export CC_DEV_SERVER_PRESSURE_LOG

# Host retention (stima-api#7881): age-expired or regenerable artifacts of our own tooling, run by
# `--check` each hour and by hand (`disk-janitor.sh --retention`; `--retention-report` forces every
# rule to shadow: it logs bytes per rule and deletes nothing). Modes: apply | shadow | off; anything
# else reads as shadow. Shadow writes each item, with its bytes, to CC_DJ_SPOTCHECK_LOG.
# : "${CC_DJ_RETENTION:=on}"                   # off: none of the rules below
# : "${CC_DJ_RET_BUDGET_SECONDS:=900}"         # a run stops starting new removals past this
# : "${CC_DJ_RET_GCLOUD_MODE:=apply}"          # ~/.config/gcloud/logs files older than ...
# : "${CC_DJ_RET_GCLOUD_DAYS:=14}"
# : "${CC_DJ_RET_RELEASE_MODE:=apply}"         # ~/.claude/jobs/release-owner run dirs: keep the newest ...
# : "${CC_DJ_RET_RELEASE_KEEP:=5}"             # ... and any with a file modified in the last ...
# : "${CC_DJ_RET_RELEASE_RECENT_HOURS:=24}"
# : "${CC_DJ_RET_SCRATCH_MODE:=shadow}"        # /private/tmp/claude-<uid>/*/<session-uuid> quiet for ... days, session not live
# : "${CC_DJ_RET_SCRATCH_DAYS:=3}"
# : "${CC_DJ_RET_PROJECTS_MODE:=shadow}"       # ~/.claude/projects/* of a worktree that no longer exists, quiet for ... days
# : "${CC_DJ_RET_PROJECTS_DAYS:=7}"
# : "${CC_DJ_RET_GOCACHE_MODE:=apply}"         # `go clean -cache` when free GB is under the threshold, once a day
# : "${CC_DJ_RET_GOCACHE_ACT_GB:=40}"          # default: CC_RW_DISK_ACT_GB (resource-watch's act threshold)
# : "${CC_DJ_RET_GOCACHE_INTERVAL_SECONDS:=86400}"
# : "${CC_DJ_RET_EVIDENCE_MODE:=apply}"        # ~/.codex/{helmway-evidence,worktrees,archived_sessions} and ~/handoffs/i<N>*; handoffs: quiet ... days AND every named issue closed
# : "${CC_DJ_RET_EVIDENCE_DAYS:=7}"            # one `gh issue list --state closed` per run; a directory naming no issue is kept
# : "${CC_DJ_RET_EVIDENCE_REPO:=theQuert/stima-api}"
# : "${CC_DJ_RET_CODEX_DAYS:=0}"               # age for ~/.codex paths (0 = none): helmway-evidence still needs its issues closed; worktrees clean + on a remote; archived_sessions not held open, never *.sqlite
# : "${CC_DJ_RET_DEV_MODE:=shadow}"            # next dev / proxy.mjs / ... SIGTERM then SIGKILL, by pid, only when all hold:
# : "${CC_DJ_RET_DEV_MIN_AGE_HOURS:=168}"      #   running this long, cwd in a linked worktree that is merged or idle for
# : "${CC_DJ_RET_DEV_IDLE_DAYS:=7}"            #   this many days, and no live claude ancestor, session cwd or session id (unknown keeps)
# : "${CC_DJ_RET_DEV_GRACE_SECONDS:=10}"
