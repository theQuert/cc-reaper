# gce-disk-watch policy. Installed at ~/.cc-reaper/gce-disk-watch.conf when absent, never overwritten.
# KEY=value lines; a GDW_* environment variable overrides the same key for one run.

# 0: shadow (a `would alert` line in ~/.cc-reaper/logs/gce-disk-watch.log, nothing else).
# 1: a `GCE-DISK ALERT` log line and a macOS notification. Leave 0 until a person has read the log.
GDW_APPLY=0

# The hosts read, each with one IAP `df -P / ; df -Pi /` and nothing else.
GDW_HOSTS=stima-ci-1 stima-ci-2 stima-ci-3 stima-ci-ctl-1 stima-ci-deploy-1
GDW_PROJECT=stima-ci-runners
GDW_ZONE=asia-east1-b

# disk-high: / used at or over this percentage, or less than this many GiB available, or inodes at or over.
GDW_USED_PCT=90
GDW_MIN_AVAIL_GB=2
GDW_INODE_PCT=90

# One host's read, and the whole run (all hosts read in parallel), in seconds.
GDW_HOST_TIMEOUT_SECONDS=90
GDW_RUN_TIMEOUT_SECONDS=240

# A state that stays is told again at most this often (the log line and the notification).
GDW_REALERT_MINUTES=120

# Consecutive unreadable reads before `unreadable` is told (one IAP blip is not); each unreadable read
# is logged with fails=<n>/<rounds>. disk-high is told on its first read.
GDW_UNREADABLE_ROUNDS=2

# Hosts whose read is refused by design (OS Login revokes the Mac's key on stima-ci-1 and stima-ci-deploy-1,
# sre 2026-10-29; stima-ci-2 and stima-ci-3 answer exit-255 on every read since 2026-11-10). They are still read every round: a failed read is logged `known-unreadable` and never told,
# a read that works is judged like any other, so disk-high still tells. Their disk is not watched while refused.
GDW_KNOWN_UNREADABLE=stima-ci-1 stima-ci-2 stima-ci-3 stima-ci-deploy-1

# gcloud's key and its .pub must both exist; without them every host is `unreadable reason=no-ssh-key`
# and gcloud is never called (it would generate a key and write it into project or instance metadata).
GDW_SSH_KEY=~/.ssh/google_compute_engine

GDW_STATE=~/.cc-reaper/state/gce-disk-watch.json
GDW_LOG=~/.cc-reaper/logs/gce-disk-watch.log
GDW_NOTIFY=1
