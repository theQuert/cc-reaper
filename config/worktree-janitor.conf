# cc-reaper's shared Claude/Codex worktree policy.
# Explicit environment values still override these settings for one-shot diagnostics.

# A worktree cannot be removed until it has settled untouched for two days.
: "${CC_WJ_IDLE_HOURS:=48}"

# Releasing a live session claim is not consent to delete. Keep the mapped worktree for
# two days after the latest Claude transcript activity or Codex update/archive time too.
: "${CC_WJ_SESSION_GRACE_HOURS:=48}"

# Work that origin already holds does not need its checkout. A clean worktree whose HEAD is
# contained in a branch origin lists now is removable once it passes every other gate, and
# one with only tracked edits or untracked files is removable after a snapshot of it has
# reached refs/wip/<label>/<worktree>-<UTC stamp> on origin and been read back. Ignored
# files that are not regenerable still keep a tree. 0 restores "landed on the base only".
: "${CC_WJ_RECLAIM_PUSHED:=1}"
: "${CC_WJ_WIP_LABEL:=macmini}"

# A launchd job that runs a script from a worktree has no process between runs, so no holder
# scan sees it. The plists in these colon-separated directories are read instead: a worktree
# containing any absolute path a plist names (ProgramArguments, Program, WorkingDirectory,
# the log paths, EnvironmentVariables, WatchPaths) is kept as KEEP(launchd-target:<Label>).
# A plist that cannot be parsed keeps every worktree. `*.disabled*` files are not jobs.
: "${CC_WJ_LAUNCHAGENTS_DIRS:=$HOME/Library/LaunchAgents:/Library/LaunchAgents:/Library/LaunchDaemons}"

# SessionEnd is a low-latency trigger and the six-hour schedule is the guarantee layer.
# Both still require every content, holder, landed, active-session and git-state gate.
: "${CC_WJ_SESSION_APPLY:=1}"
: "${CC_WJ_SCHEDULE_APPLY:=1}"

# A sweep phase stops examining worktrees after this many seconds and leaves the rest to
# the next sweep, which resumes after the last one examined (0: unbounded). Under load a
# machine-wide lsof can need more than a minute; a timed-out scan is retried once.
: "${CC_WJ_SWEEP_BUDGET_SECONDS:=1800}"
# Which worktrees a budgeted sweep reaches first (stima-api#5886). `largest` examines each
# repository's worktrees by last known size, largest first, from growth-watch's samples and
# the janitor's own measurements (no new du pass); trees not yet examined in the current cycle
# go before those already examined, and trees of unknown size go last. `path` is the old path
# order, resuming after the last one examined. Every gate applies to every tree in either order.
: "${CC_WJ_ORDER:=largest}"
: "${CC_WJ_LSOF_TIMEOUT_SECONDS:=120}"
: "${CC_WJ_LOCK_SCAN_TIMEOUT_SECONDS:=30}"
: "${CC_WJ_RECHECK_FRESH_SECONDS:=120}"

# Two kinds of ignored entry stop keeping a worktree (stima-api#5886): a top-level `*.log` file,
# and a `.claude/skills` or `.claude/commands` symlink into the repository's own primary
# checkout. `spotcheck` (the default, and what any other value means) leaves every decision as
# before and appends what these rules would have trimmed or removed - path, bytes, holder,
# rule, run id - to CC_WJ_SPOTCHECK_LOG; `auto` lets them decide.
: "${CC_WJ_NEW_RULES_MODE:=spotcheck}"
: "${CC_WJ_SPOTCHECK_LOG:=$HOME/.cc-reaper/logs/spotcheck-worktree-janitor.log}"
# A rule is promoted on its own, without turning every rule on: the names listed here decide as under
# `auto` (stima-api#7895). A rule's record is clean when no would-remove or would-trim line for it named
# a tree that, when audited, held commits origin did not contain, had a live holder or session, or lost a
# file a person wrote. Audit of 2026-11-11 (spot-check log since 2026-11-01, 5,810 lines):
#   primary-skills-link        PROMOTED  1,093 lines, 2 trees; both HEAD on origin, no holder, a link names nothing it deletes
#   session-unknown-per-tree   PROMOTED  32 lines, 22 trees: 12 are fixtures written by a test into the real log,
#                              (promoting it also lets the trim phase act per tree: a trim touches only rebuildable directories)
#                              the 10 real ones (7 since removed by this janitor, 3 present) all had HEAD on origin and no holder
#   dirty-pressure             PROBATION 4,685 lines, 16 trees; 5 hold commits origin does not contain (ci-board-gone,
#                              claude-7650-oauth-wait-mock, codex-762-ape228-test-repair, codex-762-api-description,
#                              codex-762-live-doc-alignment): the stated test is not met, though a trim never touches commits
#   pushed-idle                PROBATION no record at all (0 lines): nothing to judge yet
#   build-output               PROBATION no record at all (0 lines)
: "${CC_WJ_PROMOTED_RULES:=primary-skills-link session-unknown-per-tree}"
# evidence-expired: a landed, idle tree whose only unrebuildable entries are under the evidence root is
# removable once every issue its top-level entries name (leading digits, GitHub repository of origin) is
# closed and the newest file is at least this many days old (the founder's rule, stima-api#7881: evidence
# goes after 7 days, and only when its issue is closed). `shadow` decides nothing and logs
# rule=evidence-expired action=would-remove to the spot-check log; the flip to `apply` is this one line,
# after five clean scheduled runs. `off` does not ask. A credential-shaped file keeps the tree.
: "${CC_WJ_EVIDENCE_EXPIRY_MODE:=shadow}"
: "${CC_WJ_EVIDENCE_EXPIRY_DAYS:=7}"
: "${CC_WJ_EVIDENCE_EXPIRY_ROOT:=.codex/evidence}"
# A session record that cannot be read (a torn registry file, an unmapped Codex claim, an
# unreadable transcript) keeps only the worktrees it could be about: those its readable remains
# name, and every tree with its own activity within the session grace (stima-api#5886). Gated
# like the rules above: under spotcheck every decision stays as with `global` and the trees it
# would free are logged as rule session-unknown-per-tree; under auto it decides. `global` (or
# any value but `tree`) is the old behaviour, one unreadable record keeping every worktree.
: "${CC_WJ_UNKNOWN_SESSION_SCOPE:=tree}"

# Worktrees nothing may trim or remove, whatever the gates say: a name here matched inside a
# worktree's directory name or branch, or equal to the name of a live Claude session whose cwd
# is at or under the worktree. Whitespace-separated.
: "${CC_WJ_DENY_NAMES:=homepage uiux verify-signin-redesign}"

# Ordinary source roots.  Harness-owned worktree roots are discovered separately.
: "${CC_WJ_ROOT:=$HOME/GitHub}"
