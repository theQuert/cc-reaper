# cc-reaper's shared Claude/Codex worktree policy.
# Explicit environment values still override these settings for one-shot diagnostics.

# A worktree cannot be removed until it has settled untouched for two days.
: "${CC_WJ_IDLE_HOURS:=48}"

# Releasing a live session claim is not consent to delete. Keep the mapped worktree for
# two days after the latest Claude transcript activity or Codex update/archive time too.
: "${CC_WJ_SESSION_GRACE_HOURS:=48}"

# Work that origin already holds does not need its checkout. A clean worktree whose HEAD is
# contained in a branch origin lists now is removable once it passes every other gate, and
# one with only tracked edits or untracked files is removable after a snapshot of it has
# reached refs/wip/<label>/<worktree>-<UTC stamp> on origin and been read back. Ignored
# files that are not regenerable still keep a tree. 0 restores "landed on the base only".
: "${CC_WJ_RECLAIM_PUSHED:=1}"
: "${CC_WJ_WIP_LABEL:=macmini}"

# A launchd job that runs a script from a worktree has no process between runs, so no holder
# scan sees it. The plists in these colon-separated directories are read instead: a worktree
# containing any absolute path a plist names (ProgramArguments, Program, WorkingDirectory,
# the log paths, EnvironmentVariables, WatchPaths) is kept as KEEP(launchd-target:<Label>).
# A plist that cannot be parsed keeps every worktree. `*.disabled*` files are not jobs.
: "${CC_WJ_LAUNCHAGENTS_DIRS:=$HOME/Library/LaunchAgents:/Library/LaunchAgents:/Library/LaunchDaemons}"

# SessionEnd is a low-latency trigger and the six-hour schedule is the guarantee layer.
# Both still require every content, holder, landed, active-session and git-state gate.
: "${CC_WJ_SESSION_APPLY:=1}"
: "${CC_WJ_SCHEDULE_APPLY:=1}"

# A sweep phase stops examining worktrees after this many seconds and leaves the rest to
# the next sweep, which resumes after the last one examined (0: unbounded). Under load a
# machine-wide lsof can need more than a minute; a timed-out scan is retried once.
: "${CC_WJ_SWEEP_BUDGET_SECONDS:=1800}"
: "${CC_WJ_LSOF_TIMEOUT_SECONDS:=120}"
: "${CC_WJ_LOCK_SCAN_TIMEOUT_SECONDS:=30}"
: "${CC_WJ_RECHECK_FRESH_SECONDS:=120}"

# Two kinds of ignored entry stop keeping a worktree (stima-api#5886): a top-level `*.log` file,
# and a `.claude/skills` or `.claude/commands` symlink into the repository's own primary
# checkout. `spotcheck` (the default, and what any other value means) leaves every decision as
# before and appends what these rules would have trimmed or removed - path, bytes, holder,
# rule, run id - to CC_WJ_SPOTCHECK_LOG; `auto` lets them decide.
: "${CC_WJ_NEW_RULES_MODE:=spotcheck}"
: "${CC_WJ_SPOTCHECK_LOG:=$HOME/.cc-reaper/logs/spotcheck-worktree-janitor.log}"

# Worktrees nothing may trim or remove, whatever the gates say: a name here matched inside a
# worktree's directory name or branch, or equal to the name of a live Claude session whose cwd
# is at or under the worktree. Whitespace-separated.
: "${CC_WJ_DENY_NAMES:=homepage uiux verify-signin-redesign}"

# Ordinary source roots.  Harness-owned worktree roots are discovered separately.
: "${CC_WJ_ROOT:=$HOME/GitHub}"
