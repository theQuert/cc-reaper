# cc-reaper's shared Claude/Codex worktree policy.
# Explicit environment values still override these settings for one-shot diagnostics.

# A worktree cannot be removed until it has settled untouched for two days.
: "${CC_WJ_IDLE_HOURS:=48}"

# Releasing a live session claim is not consent to delete. Keep the mapped worktree for
# two days after the latest Claude transcript activity or Codex update/archive time too.
: "${CC_WJ_SESSION_GRACE_HOURS:=48}"

# SessionEnd is a low-latency trigger and the six-hour schedule is the guarantee layer.
# Both still require every content, holder, landed, active-session and git-state gate.
: "${CC_WJ_SESSION_APPLY:=1}"
: "${CC_WJ_SCHEDULE_APPLY:=1}"

# Ordinary source roots.  Harness-owned worktree roots are discovered separately.
: "${CC_WJ_ROOT:=$HOME/GitHub}"
