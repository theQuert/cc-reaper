# session-reaper policy. Copy to ~/.cc-reaper/session-reaper.conf (chmod 600) and edit there;
# the deployed copy holds the machine's real protection list, which does not belong in git.
# KEY=value lines; command-line flags override these for one run.

# 0: report only. 1: reap. Leave 0 until a person has read a few reports.
APPLY=0

# A session must have been idle this long before it is considered.
IDLE_MINUTES=60

# Space-separated fnmatch patterns over the tmux session name and the Claude session name.
PROTECT=

# Repository roots whose worktrees are matched to sessions; empty means every repo in ~/GitHub.
REPOS=

CLOSED_LOG=~/handoffs/closed-sessions.md
REPORT=~/.cc-reaper/state/session-reaper-report.md

# Extra regex alternatives (joined with |) that mean the last message waits on a person,
# for example a name: WAITING_EXTRA=waiting for Pat|Pat to approve
WAITING_EXTRA=

# owner/repo#N that receives a comment when a post-reap check fails (a notification is sent either way).
TRACKING_ISSUE=

# Work the process tree cannot show. A subagent or workflow transcript written this recently means
# the session is still working even when its prompt is idle.
SUBAGENT_QUIET_MINUTES=30
# A question to a person on the last 15 lines of the pane keeps the session.
PROMPT_RE=\(y/n\)|do you want to proceed|waiting for input|NEEDS_HUMAN
# Pending <issue>-*.json requests here for a claimed issue keep the session (empty: off). Answered
# requests are renamed .done or moved into a subdirectory.
RELAY_DIR=
RELAY_MAX_AGE_HOURS=48
# A path under this root named in the last message must exist before the session is reaped (empty: off).
HANDOFF_ROOT=
# One record per reaped tmux name, written before /exit, with the resume command.
REAPED_DIR=~/.cc-reaper/state/reaped

# A report for a person, never a reap: sessions idle or at a shell for this many hours with no claimed
# issue. 0: off. PROTECT does not hide a session from it; IDLE_LIST_EXCLUDE does.
IDLE_LIST_HOURS=0
# Rewritten every sweep with the current list.
IDLE_LIST_FILE=~/.cc-reaper/state/idle-sessions.md
# A path (for example ~/handoffs/neo-inbox.md): the list is appended there once per local day as
# "## key=IDLE-SESSIONS-<date>". Empty: off.
IDLE_LIST_INBOX=
# Space-separated fnmatch patterns over the tmux and session names that are never listed.
IDLE_LIST_EXCLUDE=

# A claim-less session whose newest DONE_INBOX (else DONE_INBOX_SHADOW) header is DONE, older than IDLE_MINUTES and
# its newest prompt, with no child process and nothing unpushed. shadow: report would-close, close nothing.
# apply: count it as done (every other gate still applies). off: neither. Leave shadow until reports are read.
NOCLAIM_DONE=shadow
# Pids that are never killed: a session whose pane tree holds one is kept. The environment variable wins.
CC_NEVER_KILL_PIDS=70987 4565

# stall-watch.py (the account-switch / rate-limit stall detector; it reads this same file).
# 0: shadow, print what it would report and write nothing to the inbox. 1: append one block per event.
# Leave 0 until a person has read a few rounds of its log (~/.cc-reaper/logs/stall-watch.log).
STALL_APPLY=0
STALL_INBOX=~/handoffs/neo-inbox.md
STALL_STATE=~/.cc-reaper/state/stall-watch.json
# One <session id>.json per stalled session, written only when STALL_APPLY=1; session-reaper.py keeps it with the
# reason stalled:<fingerprint> (empty: off). A mark not refreshed for STALL_MARK_HOURS is ignored, and so is one
# whose event was first seen more than STALL_MARK_MAX_HOURS ago, however fresh it is. Never point this at a
# directory that holds other files (for example ~/.claude/sessions): it is refused.
STALL_MARK_DIR=~/.cc-reaper/state/stalled
STALL_MARK_HOURS=12
STALL_MARK_MAX_HOURS=48
# Panes showing "Request interrupted" at an idle prompt at once that count as an account switch (a lone Esc does not).
STALL_FLEET_MIN=2
# A permission prompt ("Do you want to proceed?"), plan approval, folder trust or AskUserQuestion menu left on screen
# this many minutes is flagged (EL-T921): STALL_APPLY=1 appends one ## EL-T921-PROMPT-STALL <session> block to
# STALL_INBOX, once per prompt instance; shadow logs a "would alert prompt" line. 0 turns it off. While the same prompt
# stays, a "still on screen" log line at most every STALL_PROMPT_REALERT_MINUTES, never a second inbox entry.
# It never answers the prompt.
STALL_PROMPT_MINUTES=10
STALL_PROMPT_REALERT_MINUTES=120
