# session-reaper policy. Copy to ~/.cc-reaper/session-reaper.conf (chmod 600) and edit there;
# the deployed copy holds the machine's real protection list, which does not belong in git.
# KEY=value lines; command-line flags override these for one run.

# 0: report only. 1: reap. Leave 0 until a person has read a few reports.
APPLY=0

# A session must have been idle this long before it is considered.
IDLE_MINUTES=60

# Space-separated fnmatch patterns over the tmux session name and the Claude session name.
PROTECT=

# Repository roots whose worktrees are matched to sessions; empty means every repo in ~/GitHub.
REPOS=

CLOSED_LOG=~/handoffs/closed-sessions.md
REPORT=~/.cc-reaper/state/session-reaper-report.md

# Extra regex alternatives (joined with |) that mean the last message waits on a person,
# for example a name: WAITING_EXTRA=waiting for Pat|Pat to approve
WAITING_EXTRA=

# owner/repo#N that receives a comment when a post-reap check fails (a notification is sent either way).
TRACKING_ISSUE=

# Work the process tree cannot show. A subagent or workflow transcript written this recently means
# the session is still working even when its prompt is idle.
SUBAGENT_QUIET_MINUTES=30
# A question to a person on the last 15 lines of the pane keeps the session.
PROMPT_RE=\(y/n\)|do you want to proceed|waiting for input|NEEDS_HUMAN
# A path under this root named in the last message must exist before the session is reaped (empty: off).
HANDOFF_ROOT=
# One record per reaped tmux name, written before /exit, with the resume command.
REAPED_DIR=~/.cc-reaper/state/reaped

# A report for a person, never a reap: sessions idle or at a shell for this many hours with no claimed
# issue. 0: off. PROTECT does not hide a session from it; IDLE_LIST_EXCLUDE does.
IDLE_LIST_HOURS=0
# Rewritten every sweep with the current list.
IDLE_LIST_FILE=~/.cc-reaper/state/idle-sessions.md
# Space-separated fnmatch patterns over the tmux and session names that are never listed.
IDLE_LIST_EXCLUDE=

# Pids that are never killed: a session whose pane tree holds one is kept. The environment variable wins.
CC_NEVER_KILL_PIDS=70987 4565

# Session state (stima-api #7061): session_state.py judges every live session once per sweep (WORKING, PUSH,
# WAITING_PERSON, DONE, UNKNOWN). on: judge it, write sessions.json and let the sweep read it. off: neither (default on).
SESSION_STATE=on
# Where the lock, sessions.json and the shadow round counters live (default: empty, ~/.cc-reaper/state). Only a run on
# this live file with no --idle-minutes writes the sessions.json readers act on; a run on a copied config writes under
# the copy's own STATE_DIR, and nowhere when the copy leaves it unset. Set it in every preview copy.
STATE_DIR=
# A session the state calls DONE, kept only by soft reasons (no claim found, an unplaced or open issue, a check-by,
# an open PR), closes only when the existing gates pass too: NEVER_CLOSE, no child process and a clean cwd for a
# claim-less one, the not-mine gates for each claim, no BLOCKED:#N. A question to a person or
# a step the oracle calls its own always keeps it. shadow: report `would-close: state DONE`. apply: close. off:
# neither (default shadow).
STATE_DONE=shadow
# Clean shadow rounds in a row after which the sweep writes `<FLAG>=apply` for one of STATE_DONE and ORACLE_NOT_MINE
# here (default 5). Each flag has its own counter; a round counts only on this live file at APPLY=1, with
# no --idle-minutes, 25 minutes or more after the last counted one, and only when it had a candidate; the streak must
# have seen at least 3 distinct sessions. A miss (a candidate used after it was called finished) resets it.
SHADOW_CLEAN_ROUNDS=5

# The stall detector (stall-watch.py) was retired 2026-11-12 (stima-api #7904): nothing writes marks any more. The
# reaper still honours a <session id>.json mark in STALL_MARK_DIR if one is put there; it keeps it with the reason
# stalled:<fingerprint> (empty: off). A mark not refreshed for STALL_MARK_HOURS is ignored, and so is one whose
# event was first seen more than STALL_MARK_MAX_HOURS ago, however fresh it is. Never point this at a directory that
# holds other files (for example ~/.claude/sessions): it is refused.
STALL_MARK_DIR=~/.cc-reaper/state/stalled
STALL_MARK_HOURS=12
STALL_MARK_MAX_HOURS=48
