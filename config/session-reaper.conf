# session-reaper policy. Copy to ~/.cc-reaper/session-reaper.conf (chmod 600) and edit there;
# the deployed copy holds the machine's real protection list, which does not belong in git.
# KEY=value lines; command-line flags override these for one run.

# 0: report only. 1: reap. Leave 0 until a person has read a few reports.
APPLY=0

# A session must have been idle this long before it is considered.
IDLE_MINUTES=60

# Space-separated fnmatch patterns over the tmux session name and the Claude session name.
PROTECT=

# Repository roots whose worktrees are matched to sessions; empty means every repo in ~/GitHub.
REPOS=

CLOSED_LOG=~/handoffs/closed-sessions.md
REPORT=~/.cc-reaper/state/session-reaper-report.md

# Extra regex alternatives (joined with |) that mean the last message waits on a person,
# for example a name: WAITING_EXTRA=waiting for Pat|Pat to approve
WAITING_EXTRA=

# owner/repo#N that receives a comment when a post-reap check fails (a notification is sent either way).
TRACKING_ISSUE=
